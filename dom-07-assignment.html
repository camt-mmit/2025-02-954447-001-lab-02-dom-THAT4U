<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM-06: Final Dynamic Sections</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="./css/material-symbols.css" />
    <link rel="stylesheet" href="./css/dom.css" />

    <script type="module" src="./js/dom-06-final.js"></script>
  </head>
  <body>
    <div style="text-align: center; margin: 20px 0">
      <button
        class="app-cmd-add-section"
        style="
          background-color: #d0d0ff;
          color: blue;
          padding: 10px 20px;
          font-size: 16px;
          cursor: pointer;
        "
      >
        📝 Add New Section
      </button>
    </div>

    <div id="app-sections-container"></div>

    <template id="tmp-section">
      <article
        class="section-container"
        style="
          border: 1px solid #ccc;
          margin: 20px;
          padding: 20px;
          border-radius: 8px;
        "
      >
        <header
          class="section-header"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
          "
        >
          <button
            type="button"
            class="app-cl-btn app-cl-primary app-cmd-add-number-input"
            style="background-color: #d0d0ff; color: blue"
          >
            <i class="material-symbols-outlined">add</i> Input
          </button>

          <h2 style="margin: 0">
            Section <span class="app-title-section-number">1</span>
          </h2>

          <button
            class="app-cmd-remove-section"
            style="background-color: #ffcccc; color: red; cursor: pointer"
          >
            <i class="material-symbols-outlined">delete</i> Section
          </button>
        </header>

        <div class="app-cl-column-container">
          <section class="app-cmp-number-list">
            <template class="app-tmp-number-component">
              <div
                class="app-cmp-number"
                style="
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  margin-bottom: 10px;
                "
              >
                <label style="flex-grow: 1">
                  <b>Number <span class="app-title-number"></span> :: </b>
                  <input
                    type="number"
                    class="app-inp-number"
                    value="0"
                    style="padding: 5px"
                  />
                </label>
                <button
                  type="button"
                  class="app-cl-btn app-cl-warn app-cl-icon app-cmd-remove-number-input"
                  style="background-color: #ffcccc; color: red"
                >
                  <i class="material-symbols-outlined">delete_forever</i>
                </button>
              </div>
            </template>
          </section>

          <section
            style="margin-top: 20px; text-align: right; font-size: 1.2em"
          >
            <div class="app-cmp-number">
              <label>
                <b>Result :: </b>
                <output
                  class="app-cl-number app-out-number"
                  style="font-weight: bold; text-decoration: underline"
                  >0</output
                >
              </label>
            </div>
          </section>
        </div>
      </article>
    </template>
  </body>
</html>
