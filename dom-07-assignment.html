<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM-06: Final Dynamic Sections</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <style>
      /* CSS จากไฟล์ material-symbols.css */
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }

      /* CSS จากไฟล์ dom.css */
      :root {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
        --app-monospace-font: ui-monospace, monospace;
      }
      body {
        padding: 0px;
        margin: 0px;
      }
      .app-cl-primary {
        --app-color: blue;
      }
      .app-cl-warn {
        --app-color: red;
      }
      .app-cl-column-container {
        display: flex;
        flex-direction: column;
        row-gap: 4px;
      }
      input[type='number'],
      .app-cl-number {
        font-family: var(--app-monospace-font);
        text-align: right;
      }
      .app-cl-btn {
        display: inline-flex;
        flex-direction: row;
        align-items: center;
        padding: 0.5em 1ch;
        font-weight: bold;
        color: var(--app-color, inherit);
      }
      .app-cl-btn > * {
        pointer-events: none;
      }
      .app-cl-btn.app-cl-icon {
        padding: 0px;
      }
      .app-cl-btn:disabled {
        opacity: 0.25;
      }
      .app-cmp-number {
        display: flex;
        flex-direction: row;
        align-items: stretch;
      }
      .app-cmp-number > label {
        flex: 1 0 auto;
        display: inline-flex;
        flex-direction: row;
        align-items: baseline;
      }
      .app-cmp-number > label > b {
        display: inherit;
        flex-direction: inherit;
        align-items: inherit;
        margin-right: 1ch;
        width: 10ch;
      }
      .app-cmp-number > label > b > .app-title-number {
        margin-left: auto;
        font-family: var(--app-monospace-font);
      }
      .app-cmp-number > label > :is(input, output) {
        flex: 1 0 auto;
        box-sizing: border-box;
        height: 100%;
      }
      .app-cmp-number > label > output {
        font-weight: bold;
        text-decoration: underline double;
      }
      .app-cmp-section {
        display: flex;
        flex-direction: column;
        width: min(320px, 100%);
        margin-left: auto;
        margin-right: auto;
      }
      .app-cmp-section > header {
        margin-bottom: 8px;
      }
      .app-cmp-section .app-cmp-number-list {
        display: flex;
        flex-direction: column;
        row-gap: 4px;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center; margin: 20px 0">
      <button
        class="app-cmd-add-section"
        style="
          background-color: #d0d0ff;
          color: blue;
          padding: 10px 20px;
          font-size: 16px;
          cursor: pointer;
        "
      >
        📝 Add New Section
      </button>
    </div>

    <div id="app-sections-container"></div>

    <template id="tmp-section">
      <article
        class="app-cmp-section section-container"
        style="
          border: 1px solid #ccc;
          margin: 20px auto;
          padding: 20px;
          border-radius: 8px;
          background-color: white;
        "
      >
        <header
          class="section-header"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
          "
        >
          <button
            type="button"
            class="app-cl-btn app-cl-primary app-cmd-add-number-input"
            style="background-color: #d0d0ff; color: blue"
          >
            <i class="material-symbols-outlined">add</i> Input
          </button>
          <h2 style="margin: 0">
            Section <span class="app-title-section-number">1</span>
          </h2>
          <button
            class="app-cmd-remove-section"
            style="background-color: #ffcccc; color: red; cursor: pointer"
          >
            <i class="material-symbols-outlined">delete</i> Section
          </button>
        </header>

        <div class="app-cl-column-container">
          <section class="app-cmp-number-list">
            <template class="app-tmp-number-component">
              <div
                class="app-cmp-number"
                style="
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  margin-bottom: 10px;
                "
              >
                <label style="flex-grow: 1">
                  <b>Number <span class="app-title-number"></span> :: </b>
                  <input
                    type="number"
                    class="app-inp-number"
                    value="0"
                    style="padding: 5px"
                  />
                </label>
                <button
                  type="button"
                  class="app-cl-btn app-cl-warn app-cl-icon app-cmd-remove-number-input"
                  style="background-color: #ffcccc; color: red"
                >
                  <i class="material-symbols-outlined">delete_forever</i>
                </button>
              </div>
            </template>
          </section>
          <section
            style="margin-top: 20px; text-align: right; font-size: 1.2em"
          >
            <div class="app-cmp-number">
              <label>
                <b>Result :: </b>
                <output
                  class="app-cl-number app-out-number"
                  style="font-weight: bold; text-decoration: underline"
                  >0</output
                >
              </label>
            </div>
          </section>
        </div>
      </article>
    </template>

    <script>
      // 1. ฟังก์ชัน createComponent (Logic เดิมของคุณ)
      function createComponent(componentElem) {
        const templateElem = componentElem.querySelector(
          '.app-tmp-number-component',
        );
        if (!templateElem)
          throw new Error('Template .app-tmp-number-component is not found');

        const inputListContainer = templateElem.parentElement;
        if (!inputListContainer)
          throw new Error(
            'Template .app-tmp-number-component does not have parent',
          );

        const regenerateTitleNumbersAndStatus = () => {
          [...inputListContainer.querySelectorAll('.app-cmp-number')].forEach(
            (inputContainer, index, items) => {
              [...inputContainer.querySelectorAll('.app-title-number')].forEach(
                (elem) => (elem.textContent = `${index + 1}`),
              );
              [
                ...inputContainer.querySelectorAll(
                  '.app-cmd-remove-number-input',
                ),
              ].forEach((elem) => (elem.disabled = items.length === 1));
            },
          );
        };

        const recalculateResult = () => {
          const result = [
            ...inputListContainer.querySelectorAll('.app-inp-number'),
          ].reduce(
            (result, elem) =>
              result +
              (Number.isNaN(elem.valueAsNumber) ? 0 : elem.valueAsNumber),
            0,
          );
          [...componentElem.querySelectorAll('.app-out-number')].forEach(
            (elem) => (elem.textContent = result.toLocaleString()),
          );
        };

        const createInputComponent = () => {
          const inputContainer =
            templateElem.content.cloneNode(true).firstElementChild;
          inputContainer.addEventListener('click', (ev) => {
            if (ev.target.closest('.app-cmd-remove-number-input')) {
              inputContainer.remove();
              regenerateTitleNumbersAndStatus();
              recalculateResult();
            }
          });
          inputContainer.addEventListener('input', recalculateResult);
          inputListContainer.append(inputContainer);
          regenerateTitleNumbersAndStatus();
          recalculateResult();
        };

        inputListContainer.addEventListener('change', (ev) => {
          if (ev.target?.matches('.app-inp-number')) recalculateResult();
        });

        componentElem.addEventListener('click', (ev) => {
          if (ev.target.closest('.app-cmd-add-number-input'))
            createInputComponent();
        });

        createInputComponent();
        return componentElem;
      }

      // 2. ฟังก์ชัน initApp (Logic จัดการ Section)
      function initApp() {
        const sectionsContainer = document.getElementById(
          'app-sections-container',
        );
        const sectionTemplate = document.getElementById('tmp-section');
        const addSectionBtn = document.querySelector('.app-cmd-add-section');

        const updateSectionInfo = () => {
          const sections = [
            ...sectionsContainer.querySelectorAll('.section-container'),
          ];
          sections.forEach((section, index) => {
            const titleElem = section.querySelector(
              '.app-title-section-number',
            );
            if (titleElem) titleElem.textContent = index + 1;

            const removeBtn = section.querySelector('.app-cmd-remove-section');
            if (removeBtn) removeBtn.disabled = sections.length === 1;
          });
        };

        const createSection = () => {
          const newSection =
            sectionTemplate.content.cloneNode(true).firstElementChild;
          createComponent(newSection);

          const removeBtn = newSection.querySelector('.app-cmd-remove-section');
          removeBtn.addEventListener('click', () => {
            newSection.remove();
            updateSectionInfo();
          });

          sectionsContainer.append(newSection);
          updateSectionInfo();
        };

        if (addSectionBtn)
          addSectionBtn.addEventListener('click', createSection);

        // สร้าง Section แรกทันที
        createSection();
      }

      // รันโปรแกรมเมื่อโหลดเสร็จ
      document.addEventListener('DOMContentLoaded', initApp);
    </script>
  </body>
</html>
